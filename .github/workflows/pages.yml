name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - processed/newsletter-state.json
  workflow_dispatch:
    inputs:
      newsletter_force:
        description: "Vynutit nový Ecomail koncept i pro stejné vydání"
        type: boolean
        default: false
  schedule:
    # Po–Pá večer a ráno (UTC) — po jednání PS
    - cron: "30 20 * * 1-5"
    - cron: "0 4 * * 1-6"

concurrency:
  group: pages
  # Nerušit rozběhnutý build: zrušení mezi konceptem v Ecomailu a commitem stavu
  # vedlo ke druhému konceptu stejného vydání. Další push jen počká.
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SVEJK_SITE_URL: https://poslusnehlasim.cz
  SVEJK_BASE_PATH: ""
  ECOMAIL_FROM_NAME: Poslušně hlásím

jobs:
  build:
    # Ruční spuštění z jiné větve nesmí nasadit na produkci ani poslat newsletter.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-svejk

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q

      - name: Publish gate check
        run: ./run-svejk.sh publish-check --obdobi 2025

      - name: Export static site
        env:
          SVEJK_PAGES_CNAME: poslusnehlasim.cz
          SVEJK_PUBLISH_GATE: "1"
          SVEJK_SHOW_SUBSCRIBE: "1"
          SVEJK_SUBSCRIBE_API_URL: ${{ secrets.SVEJK_SUBSCRIBE_API_URL }}
          SVEJK_TURNSTILE_SITE_KEY: ${{ vars.SVEJK_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$SVEJK_SUBSCRIBE_API_URL" ]; then
            echo "::warning::SVEJK_SUBSCRIBE_API_URL chybí — odběr na webu nemusí fungovat. Nasaz worker: workflow Deploy subscribe worker."
          fi
          ./run-svejk.sh export-pages --obdobi 2025 --out site --cname poslusnehlasim.cz

      - name: Lint exported site
        run: python scripts/lint_site.py site

      - name: Notify newsletter (Ecomail)
        continue-on-error: true
        env:
          ECOMAIL_API_KEY: ${{ secrets.ECOMAIL_API_KEY }}
          ECOMAIL_LIST_ID: "3"
          ECOMAIL_FROM_EMAIL: ${{ secrets.ECOMAIL_FROM_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
          NEWSLETTER_FORCE: ${{ inputs.newsletter_force }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$ECOMAIL_API_KEY" ]; then
            echo "ECOMAIL_API_KEY není nastaven — přeskočeno"
            exit 0
          fi
          # Stav z aktuálního main (jiný běh mohl mezitím vytvořit koncept), ne ze SHA tohoto buildu.
          git fetch --depth=1 origin "$REF_NAME" \
            && git checkout FETCH_HEAD -- processed/newsletter-state.json \
            || echo "::warning::newsletter-state.json z origin se nepodařilo načíst"
          FORCE_FLAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$NEWSLETTER_FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          ./run-svejk.sh newsletter-notify --obdobi 2025 --out site $FORCE_FLAG \
            || echo "::error title=Newsletter notify selhal::Koncept v Ecomailu nevznikl (detail v logu a v last_error v newsletter-state.json). Příští deploy to zkusí znovu; deploy pokračuje."

      - name: Commit newsletter state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed/newsletter-state.json
          if git diff --staged --quiet; then
            echo "Newsletter state beze změny."
            exit 0
          fi
          git commit -m "newsletter: aktualizace stavu po notify [skip ci]"
          # Build a sync můžou pushnout současně: před push dorovnat main (jiné soubory → bez konfliktu).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::git push selhal i po 5 pokusech"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Až je /share/… živé na webu — Incoming Webhook + veřejná URL karty.
  slack:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # build job mohl mezitím pushnout newsletter-state.json
          git fetch origin "$REF_NAME"
          git reset --hard "origin/$REF_NAME"

      - uses: ./.github/actions/setup-svejk

      - name: Slack share card
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL není nastaven — přeskočeno"
            exit 0
          fi
          ./run-svejk.sh newsletter-slack --obdobi 2025 || echo "Slack notify selhal"

      - name: Commit slack state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed/newsletter-state.json
          if git diff --staged --quiet; then
            echo "Slack state beze změny."
            exit 0
          fi
          git commit -m "newsletter: slack state po deployi [skip ci]"
          # Build a sync můžou pushnout současně: před push dorovnat main (jiné soubory → bez konfliktu).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::git push selhal i po 5 pokusech"
              exit 1
            fi
            sleep $((attempt * 5))
          done
